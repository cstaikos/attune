<div class="library-layout">
  <header class="library-intro">
    <div>
      <p class="eyebrow">Music for meaningful sessions</p>
      <h2>{{routeData()['heading']}}</h2>
      <p>{{routeData()['description']}}</p>
    </div>
    <a matButton appButton="primary" routerLink="/create">+ Add a playlist</a>
  </header>
  <div class="column-toolbar">
    <div>
      <button
        matButton
        appButton="secondary"
        class="filter-trigger"
        [attr.aria-expanded]="filtersOpen()"
        aria-controls="library-filters"
        (click)="filtersOpen.set(!filtersOpen())"
      >
        Filters</button
      ><span role="status" class="result-count"
        >{{page.loading() ? 'Finding playlists…' :
        (page.data()?.playlists?.length ?? 0)+' playlists'}}</span
      ><button matButton appButton="text" (click)="clear()">
        Clear filters
      </button>
    </div>
    <div class="toolbar-actions">
      <button
        matButton
        appButton="secondary"
        [disabled]="page.loading()"
        (click)="load(undefined, true)"
      >
        Refresh playlists
      </button>
      <mat-form-field
         appField="Sort playlists" #field1="appField"><mat-label>Sort playlists</mat-label><select
          matNativeControl
          id="sort"
          [ngModel]="query().sort"
          (ngModelChange)="setSort($event)"
        >
          <option value="newest">Newest</option>
          <option value="favorites">Most saved</option>
          <option value="comments">Most discussed</option>
        </select><mat-error>{{field1.validationMessage()}}</mat-error></mat-form-field>
      <div class="view-switch" role="group" aria-label="Library view">
        <button
          matButton
          appButton="chip"
          [attr.aria-pressed]="layout()==='cards'"
          (click)="layout.set('cards')"
        >
          ▦ Cards</button
        ><button
          matButton
          appButton="chip"
          [attr.aria-pressed]="layout()==='list'"
          (click)="layout.set('list')"
        >
          ☰ List
        </button>
      </div>
    </div>
  </div>
  @if(filtersOpen()){<app-library-filters
    [query]="query()"
    (changed)="query.set($event)"
  />}
  <div class="library-results">
    <app-page-status
      [loading]="page.loading()"
      [error]="page.error()"
      (retry)="load()"
    /><app-action-feedback [error]="action.error()" /> @if(page.data();as data){
    <app-list-view
      [items]="data.playlists"
      label="Playlists"
      [searchable]="false"
      [resetKey]="query()"
      [layout]="layout()==='list' ? 'playlist-grid playlist-list' : 'playlist-grid'"
    >
      <ng-template let-playlist>
        <app-playlist-card
          [playlist]="playlist"
          [creator]="creator(playlist.creatorId)"
          [saved]="data.saved.includes(playlist.id)"
          [busy]="action.busy()"
          (save)="save(playlist)"
        />
      </ng-template>
    </app-list-view>
    }
  </div>
</div>
