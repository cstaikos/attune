<div class="library-layout">
  <div class="column-toolbar">
    <div>
      <button
        matButton
        appButton="secondary"
        class="filter-trigger"
        [attr.aria-expanded]="filtersOpen()"
        aria-controls="library-filters"
        (click)="filtersOpen.set(!filtersOpen())"
      >
        Filters</button
      ><span role="status" class="result-count"
        >{{page.loading() ? 'Finding playlists…' :
        (page.data()?.playlists?.length ?? 0)+' playlists'}}</span
      ><button matButton appButton="text" (click)="clear()">
        Clear filters
      </button>
    </div>
    <form class="library-search" role="search" (ngSubmit)="searchLibrary()">
      <mat-form-field appField="Search playlists" #searchField="appField"
        ><mat-label>Search playlists</mat-label
        ><input
          matInput
          id="global-search"
          type="search"
          name="search"
          [(ngModel)]="search"
          placeholder="Search the library"
        /><mat-error>{{searchField.validationMessage()}}</mat-error
        ><button
          matSuffix
          matButton
          appButton="text"
          size="small"
          type="submit"
        >
          Search
        </button></mat-form-field
      >
    </form>
    <div class="toolbar-actions">
      <mat-form-field appField="Sort playlists" #field1="appField"
        ><mat-label>Sort playlists</mat-label
        ><select
          matNativeControl
          id="sort"
          [ngModel]="query().sort"
          (ngModelChange)="setSort($event)"
        >
          <option value="newest">Newest</option>
          <option value="favorites">Most saved</option>
          <option value="comments">Most discussed</option></select
        ><mat-error>{{field1.validationMessage()}}</mat-error></mat-form-field
      >
      <a matButton appButton="primary" routerLink="/create">+ Add a playlist</a>
    </div>
  </div>
  @if(filtersOpen()){<app-library-filters
    [query]="query()"
    (changed)="query.set($event)"
  />}
  <div class="library-results">
    <app-page-status
      [loading]="page.loading()"
      [error]="page.error()"
      (retry)="load()"
    /><app-action-feedback [error]="action.error()" /> @if(page.data();as data){
    <app-list-view
      class="library-list"
      [items]="data.playlists"
      label="Playlists"
      [searchable]="false"
      [resetKey]="query()"
      layout="playlist-grid"
    >
      <ng-template let-playlist>
        <app-playlist-card
          [playlist]="playlist"
          [creator]="creator(playlist.creatorId)"
          [saved]="data.saved.includes(playlist.id)"
          [busy]="action.busy()"
          (save)="save(playlist)"
        />
      </ng-template>
    </app-list-view>
    }
  </div>
</div>
